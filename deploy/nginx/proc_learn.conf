# /etc/nginx/conf.d/proc_learn.conf
# Reverse proxy for Proc Learn. App listens on 127.0.0.1:3055 only.
# Replace YOUR_DOMAIN, then issue the certificate (see deploy/README-deploy.md).
# Everything below is scoped to Proc Learn (own cache zone / variable names), so other
# sites on this server are not affected. Create the cache dir once:
#   sudo mkdir -p /var/cache/nginx/proc_learn && sudo chown www-data /var/cache/nginx/proc_learn

# Static files only (build assets, optimised images, branding). Never API data or pages:
# those depend on the signed-in user.
proxy_cache_path /var/cache/nginx/proc_learn levels=1:2 keys_zone=proc_learn_static:20m
                 max_size=1g inactive=30d use_temp_path=off;

# Next's image optimiser answers AVIF / WebP / original depending on the browser.
map $http_accept $proc_learn_img_fmt {
    default         "orig";
    "~*image/avif"  "avif";
    "~*image/webp"  "webp";
}

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;
    server_tokens off;
    client_max_body_size 50m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://YOUR_DOMAIN$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name YOUR_DOMAIN;

    server_tokens off;
    client_max_body_size 50m;

    ssl_certificate /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Compression here instead of in Node (set NEXT_COMPRESS=false in the app's .env).
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/rss+xml image/svg+xml text/x-component;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    location = /api/health {
        proxy_pass http://127.0.0.1:3055;
        access_log off;
    }

    # Build output: file names change on every deploy, so cache for a year.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3055;
        proxy_cache proc_learn_static;
        proxy_cache_valid 200 365d;
        proxy_cache_use_stale error timeout updating;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Cache $upstream_cache_status always;
        access_log off;
    }

    # Resized logo / background / favicon images.
    location /_next/image {
        proxy_pass http://127.0.0.1:3055;
        proxy_cache proc_learn_static;
        proxy_cache_key "$scheme$host$request_uri|$proc_learn_img_fmt";
        proxy_cache_valid 200 30d;
        proxy_cache_use_stale error timeout updating;
        add_header X-Cache $upstream_cache_status always;
        access_log off;
    }

    # Uploaded branding: a new upload gets a new URL, so a cached copy never goes stale.
    location /api/site/branding/ {
        proxy_pass http://127.0.0.1:3055;
        proxy_cache proc_learn_static;
        proxy_cache_valid 200 365d;
        proxy_cache_valid any 0;
        add_header X-Cache $upstream_cache_status always;
        access_log off;
    }

    # Bundled images in public/assets.
    location /assets/ {
        proxy_pass http://127.0.0.1:3055;
        proxy_cache proc_learn_static;
        proxy_cache_valid 200 1d;
        expires 1d;
        access_log off;
    }

    # JSON APIs: buffer so slow lab connections don't hold a Node worker while bytes trickle out.
    location /api/ {
        proxy_pass http://127.0.0.1:3055;
        proxy_buffering on;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:3055;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }
}
