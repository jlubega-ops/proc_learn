# /etc/nginx/conf.d/proc_learn.conf — copy with proc_learn.headers.inc, proc_learn.security.inc and
# proc_learn.proxy.inc into /etc/nginx/conf.d/, replace YOUR_DOMAIN, then: sudo mkdir -p /var/cache/nginx/proc_learn
# Full TLS vhost for YOUR_DOMAIN (Proc Learn — docker compose project proc_learn, app on 127.0.0.1:3055)
# Static-only cache: build assets, optimised images, branding. Never API data or pages.
proxy_cache_path /var/cache/nginx/proc_learn levels=1:2 keys_zone=proc_learn_static:20m
                 max_size=1g inactive=30d use_temp_path=off;

map $http_accept $proc_learn_img_fmt {
    default         "orig";
    "~*image/avif"  "avif";
    "~*image/webp"  "webp";
}

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://YOUR_DOMAIN$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name YOUR_DOMAIN;

    server_tokens off;
    client_max_body_size 50m;

    ssl_certificate /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/conf.d/proc_learn.security.inc;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/rss+xml image/svg+xml text/x-component;

    location = /api/health {
        proxy_pass http://127.0.0.1:3055;
        include /etc/nginx/conf.d/proc_learn.proxy.inc;
        access_log off;
    }

    # Build output: file names change on every deploy.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3055;
        include /etc/nginx/conf.d/proc_learn.headers.inc;
        proxy_cache proc_learn_static;
        proxy_cache_valid 200 365d;
        proxy_cache_use_stale error timeout updating;
        include /etc/nginx/conf.d/proc_learn.security.inc;
        add_header X-Cache $upstream_cache_status always;
        access_log off;
    }

    # Resized logo / background / favicon images.
    location /_next/image {
        proxy_pass http://127.0.0.1:3055;
        include /etc/nginx/conf.d/proc_learn.headers.inc;
        proxy_cache proc_learn_static;
        proxy_cache_key "$scheme$host$request_uri|$proc_learn_img_fmt";
        proxy_cache_valid 200 30d;
        proxy_cache_use_stale error timeout updating;
        include /etc/nginx/conf.d/proc_learn.security.inc;
        add_header X-Cache $upstream_cache_status always;
        access_log off;
    }

    # Uploaded branding: a new upload gets a new URL, so a cached copy never goes stale.
    location /api/site/branding/ {
        proxy_pass http://127.0.0.1:3055;
        include /etc/nginx/conf.d/proc_learn.headers.inc;
        proxy_cache proc_learn_static;
        proxy_cache_valid 200 365d;
        proxy_cache_valid any 0;
        include /etc/nginx/conf.d/proc_learn.security.inc;
        add_header X-Cache $upstream_cache_status always;
        access_log off;
    }

    # Bundled images in public/assets.
    location /assets/ {
        proxy_pass http://127.0.0.1:3055;
        include /etc/nginx/conf.d/proc_learn.headers.inc;
        proxy_cache proc_learn_static;
        proxy_cache_valid 200 1d;
        expires 1d;
        access_log off;
    }

    # JSON APIs: buffered so slow connections don't hold a Node worker.
    location /api/ {
        proxy_pass http://127.0.0.1:3055;
        include /etc/nginx/conf.d/proc_learn.headers.inc;
        proxy_buffering on;
    }

    location / {
        proxy_pass http://127.0.0.1:3055;
        include /etc/nginx/conf.d/proc_learn.proxy.inc;
    }
}
